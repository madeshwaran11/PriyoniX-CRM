# =========================================
# APPLICATION
# =========================================

spring.application.name=priyonix-crm


# =========================================
# POSTGRESQL DATABASE (SUPABASE)
# =========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/priyonix_crm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}


# =========================================
# JPA / HIBERNATE
# =========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================
# SERVER
# =========================================

server.port=${PORT:8080}


# =========================================
# GMAIL SMTP
# =========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =========================================
# SPRING SECURITY DEBUG
# =========================================
# Temporary: helps us identify the 403 problem

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

# Comma-separated origins allowed to call this API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
