
# ==========================================
# PRIYONIX CRM - APPLICATION CONFIGURATION
# ==========================================

spring.application.name=priyonix-crm
server.port=8080

# ==========================================
# LOAD LOCAL ENVIRONMENT FILE
# Run Spring Boot from the backend folder
# ==========================================

spring.config.import=optional:file:./.env[.properties]

# ==========================================
# MYSQL DATABASE
# Keep your existing working credentials
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/priyonix_crm
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# Preserve your existing settings if different
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GMAIL SMTP - FORGOT PASSWORD EMAILS
# Credentials are stored in backend/.env
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

# ==========================================
# SMTP CONNECTION TIMEOUTS
# ==========================================

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
